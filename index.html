<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datatrening – øvings-PC (simulering) for skolen</title>
<meta name="description" content="Datatrening er en undervisningsapp for ungdomsskolen: en simulert PC i nettleseren der elever øver på filer, mapper, lagring og innlevering. Ingen innlogging, ingen data sendes.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="desktop">
    <div id="desktop-icons"></div>
    <div id="windows"></div>
    <div id="startmenu" class="hidden">
      <div class="sm-title">Alle programmer</div>
      <div class="sm-grid"></div>
      <div class="sm-foot"><span class="sm-user">👤 <span id="sm-name">Elev</span></span><span class="sm-tip">Tips: Windows-tasten ⊞ åpner også Start-menyen på en ekte PC.</span></div>
    </div>
    <div id="taskbar">
      <div id="taskbar-center"></div>
      <div id="taskbar-right"><div id="sim-label">Øvings-PC<br>simulering</div><div id="clock"></div></div>
    </div>
    <div id="toasts"></div>
    <div id="modal-layer" class="hidden"></div>
  </div>
  <aside id="coach">
    <div id="coach-head">
      <div class="coach-logo">💻</div>
      <div class="coach-title"><div>Datatrening</div><div class="coach-sub" id="coach-name">Lær å bruke PC</div></div>
      <button id="coach-toggle" title="Skjul/vis veilederen">›</button>
    </div>
    <div id="coach-tabs">
      <button class="ctab" data-tab="oppdrag">Oppdrag</button>
      <button class="ctab" data-tab="kurs">Kurs</button>
      <button class="ctab" data-tab="fremdrift">Fremdrift</button>
    </div>
    <div id="coach-body"></div>
  </aside>
</div>
<script src="js/ui.js"></script>
<script src="js/icons.js"></script>
<script src="js/fs.js"></script>
<script src="js/wm.js"></script>
<script src="js/dialogs.js"></script>
<script src="js/explorer.js"></script>
<script src="js/apps.js"></script>
<script src="js/oppdrag.js"></script>
<script src="js/coach.js"></script>
<script src="js/main.js"></script>
</body>
</html>
