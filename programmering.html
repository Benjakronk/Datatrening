<!DOCTYPE html>

<head>

<meta name="description" content="Kurssett for programmeringselever: terminal (PowerShell), Kode-editor og Python på en simulert øvings-PC i nettleseren. Ingen innlogging, ingen data sendes.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/style.css">
<script>
  /* Denne siden bruker programmeringskursene og har Terminal og Kode i oppgavelinjen */
  window.DT_PAGE = 'prog';
  window.DT_PINNED = ['explorer', 'kode', 'terminal', 'nettleser'];
  window.DT_WELCOME = '<p>Dette er <b>programmeringskurset</b> i Datatrening. Her lærer du å bruke terminalen (PowerShell), skrive kode i en editor og kjøre programmene dine. Kurset forutsetter at du kan det grunnleggende om filer og mapper fra grunnkurset.</p><p>Alt skjer på en <b>øvings-PC</b> i nettleseren, så du kan ikke ødelegge noe.</p>';
